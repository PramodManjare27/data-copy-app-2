{% extends "layout/base.html" %}
{% block title %}Edit {{ entry.label }} — {{ app_title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h5 class="fw-bold mb-1">{{ entry.label }}</h5>
    <p class="text-muted small mb-0">{{ entry.path }}</p>
  </div>
  <a href="{{ url_for('admin.list_configs') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back to configs
  </a>
</div>

<form method="post">
  <div class="card-surface p-3">
    <textarea name="content" class="form-control font-monospace" style="min-height:520px; font-size:0.85rem;" spellcheck="false">{{ content }}</textarea>
    <div class="form-text">Must be valid JSON — this is validated on save before the file is written.</div>
  </div>
  <div class="d-flex justify-content-end mt-3">
    <button type="submit" class="btn btn-primary fw-semibold px-4">
      <i class="bi bi-save me-1"></i>Save changes
    </button>
  </div>
</form>
{% endblock %}
