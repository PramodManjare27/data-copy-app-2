# One ServiceAccount per app instance, each federated to its own Azure
# User-Assigned Managed Identity via Azure AD Workload Identity (the
# recommended auth_mode: uami path in databricks_config.yaml). Replace the
# client-id and tenant-id annotations with the values for each UAMI, and
# ensure that identity has been granted access to the target Databricks
# workspace (and nothing else).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcc-prod-preprod-sa
  namespace: data-copy-console
  annotations:
    azure.workload.identity/client-id: "<prod-preprod-uami-client-id>"
    azure.workload.identity/tenant-id: "<azure-ad-tenant-id>"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcc-preprod-dev-sa
  namespace: data-copy-console
  annotations:
    azure.workload.identity/client-id: "<preprod-dev-uami-client-id>"
    azure.workload.identity/tenant-id: "<azure-ad-tenant-id>"
  labels:
    azure.workload.identity/use: "true"
